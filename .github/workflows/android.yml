name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# a newer push cancels an older build that is still running
concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop if the old zip is still in the repo
        run: |
          if [ -f shelfie-github-files.zip ]; then
            echo "::error::shelfie-github-files.zip is in the repo. It holds OLD copies of the files. Delete it and upload the files one by one."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy the website into the app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
          cp icon-*.png www/ 2>/dev/null || true

      - name: Check the backup code is in the files
        run: |
          grep -q "1.4.2" index.html || { echo "::error::index.html is not the newest version (no backup-folder-1109c)"; exit 1; }
          grep -q "pickFolder" native/ShelfieFilesPlugin.java || { echo "::error::native/ShelfieFilesPlugin.java is the OLD plugin (no pickFolder)"; exit 1; }
          grep -q "ShelfieFilesPlugin" native/MainActivity.java || { echo "::error::MainActivity.java does not register ShelfieFilesPlugin"; exit 1; }
          grep -q "native/\*.java" native/patch_android.py || { echo "::error::native/patch_android.py is the OLD one"; exit 1; }
          [ -f native/ShelfieIconPlugin.java ] || { echo "::error::native/ShelfieIconPlugin.java is missing (needed to change the app icon)"; exit 1; }
          grep -q "ShelfieIconPlugin" native/MainActivity.java || { echo "::error::native/MainActivity.java is the OLD one (no icon plugin / back button)"; exit 1; }
          grep -q "shBack" native/MainActivity.java || { echo "::error::native/MainActivity.java is the OLD one (no back button handling)"; exit 1; }
          grep -q "Icon_terracotta" native/patch_android.py || { echo "::error::native/patch_android.py is the OLD one (no icon entries)"; exit 1; }
          [ -f native/ShelfieWebPlugin.java ] || { echo "::error::native/ShelfieWebPlugin.java is missing (needed for Romanian book shops)"; exit 1; }
          grep -q "ShelfieWebPlugin" native/MainActivity.java || { echo "::error::native/MainActivity.java is the OLD one (no web plugin)"; exit 1; }
          grep -q "ShelfieWebPlugin" native/patch_android.py || { echo "::error::native/patch_android.py is the OLD one (does not copy the web plugin)"; exit 1; }
          echo "Backup files OK"

      - name: Create Android project
        run: npx cap add android

      - name: App icon (optional)
        continue-on-error: true
        run: |
          if [ -f icon-512.png ]; then
            mkdir -p assets
            cp icon-512.png assets/icon-only.png
            npx -y @capacitor/assets generate --android --iconBackgroundColor '#faf6f0' --iconBackgroundColorDark '#faf6f0'
          fi

      - name: Add the native reading timer
        run: |
          PKG=android/app/src/main/java/com/shelfie/app
          mkdir -p "$PKG" android/app/src/main/res/drawable
          cp native/*.java "$PKG"/
          cp native/ic_*.xml android/app/src/main/res/drawable/
          python3 native/patch_android.py
          npx cap sync android
          grep -q pickFolder "$PKG/ShelfieFilesPlugin.java" && echo "Plugin copied into the app"
          grep -rq 1.4.2 android/app/src/main/assets/public/index.html && echo "New page copied into the app"
          grep -o '"@capacitor/core": *"[^"]*"' package.json || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Shelfie.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Shelfie app (latest build)
          body: Download Shelfie.apk below and install it on your phone.
          files: Shelfie.apk
          make_latest: true
          
