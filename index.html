input[type=range]{width:100%;accent-color:var(--ac)}

/* smooth motion */
.bt,.in,.card,.tile,.tab{transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .25s ease,border-color .25s ease,box-shadow .25s ease,opacity .2s ease}

.in:focus{box-shadow:0 0 0 3px var(--ac2)}
