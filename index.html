const tgc=(id,c)=>ch(id,b=>{b.cl=b.cl||[];let i=b.cl.indexOf(c);i<0?b.cl.push(c):b.cl.splice(i,1)});
const meta=b=>`${b.sd?`<p class="mu" style="text-align:center;margin:10px 0 0">Started ${dt(b.sd)}${b.fd&&b.st==='done'?' · Finished '+dt(b.fd):''}</p>`:''}${(S.col||[]).length?`<div class="tabs" style="flex-wrap:wrap;justify-content:center">${S.col.map(c=>`<span class="tab ${(b.cl||[]).includes(c.id)?'on':''}" onclick="tgc('${b.id}','${c.id}')">${esc(c.e||'')} ${esc(c.n)}</span>`).join('')}</div>`:''}`;
function fan(c){const bs=S.b.filter(b=>(b.cl||[]).includes(c.id)).slice(0,4),g=CL[c.c%CL.length];
 return `<div class="fan" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${bs.map((b,i)=>{const o=i-(bs.length-1)/2;return `<div class="fb" style="left:calc(50% - 25px + ${o*27}px);transform:rotate(${o*9}deg);z-index:${Math.round(10-Math.abs(o)*2)}">${cv(b,'cvf')}</div>`}).join('')}</div>`}
const colcard=c=>`<div class="coll" onclick="v.col='${c.id}';v.tab='all';R()">${fan(c)}<div class="t" style="text-align:center;margin-top:8px">${esc(c.n)} ${esc(c.e||'')}</div><div class="mu" style="text-align:center">${S.b.filter(b=>(b.cl||[]).includes(c.id)).length} books</div></div>`;
function savec(){const n=$('#cn').value.trim();if(!n)return;(S.col=S.col||[]).push({id:uid(),n,e:$('#ce').value.trim(),c:v.cc||0});S.mm=Date.now();MD=1;v.sh=null;save();R()}
function delc(id){if(!confirm('Delete this collection? Your books stay on the shelf.'))return;S.col=(S.col||[]).filter(c=>c.id!==id);S.b.forEach(b=>{if(b.cl)b.cl=b.cl.filter(x=>x!==id)});v.col=null;S.mm=Date.now();MD=1;save();R()}
function COLSH(){return `<div class="sh"><div><h2 style="margin-top:0">New collection</h2><input class="in" id="cn" placeholder="Name (e.g. Beach reads)"><input class="in" id="ce" placeholder="Emoji (optional)" maxlength="4"><div class="row">${CL.map((g,i)=>`<span class="cdot" onclick="v.cc=${i};document.querySelectorAll('.cdot').forEach((e,j)=>e.style.borderColor=j===${i}?'var(--ac)':'transparent')" style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,${g[0]},${g[1]});border:3px solid ${i===(v.cc||0)?'var(--ac)':'transparent'}"></span>`).join('')}</div><div class="row"><button class="bt" onclick="v.sh=null;R()">Cancel</button><button class="bt pr" style="flex:1" onclick="savec()">Create</button></div></div></div>`}
function lst(){const so=S.so||'new',vw=S.vw||'shelf',l=S.b.filter(b=>(v.tab==='all'||b.st===v.tab)&&(!v.col||(b.cl||[]).includes(v.col))&&(b.t+' '+b.a).toLowerCase().includes(v.q.toLowerCase()));
 if(so!=='new')l.sort((x,y)=>so==='title'?x.t.localeCompare(y.t):so==='author'?x.a.localeCompare(y.a):so==='prog'?pc(y)-pc(x):(y.r||0)-(x.r||0));
 if(!l.length)return '<p class="mu">Nothing here yet. Tap Add to start your shelf.</p>';
 if(vw==='shelf'){const D=['🪴','🕯️','🧸','🔮','🏺'];let h='';for(let i=0;i<l.length;i+=4){const r=l.slice(i,i+4);h+=`<div class="rw">${r.map(b=>`<div onclick="op('${b.id}')" style="cursor:pointer">${cv(b,'cvs')}</div>`).join('')}${r.length<4?`<div class="dc">${D[(i/4)%D.length]}</div>`:''}</div><div class="pl"></div>`}return h}
 if(vw==='grid')return '<div class="gd">'+l.map(b=>`<div onclick="op('${b.id}')" style="cursor:pointer">${cv(b,'cvg')}<div class="bar" style="height:5px"><i style="width:${pc(b).toFixed(0)}%"></i></div><div class="t" style="font-size:13px">${esc(b.t)}</div></div>`).join('')+'</div>';
 return l.map(b=>`<div class="card" onclick="op('${b.id}')">${cv(b,'cv')}<div class="fl"><div class="t">${esc(b.t)}</div><div class="mu">${esc(b.a)}${b.sr?' · '+esc(b.sr):''}</div><div class="bar"><i style="width:${pc(b).toFixed(0)}%"></i></div><div class="mu">${pc(b).toFixed(0)}%${(b.m==='pages'||b.adv)&&b.pages?` · ${b.cur||0}/${b.pages} pages`:''}${b.r?' · '+'★'.repeat(b.r):''}</div></div></div>`).join('')}
function stk(){let d=new Set(S.s.map(x=>new Date(x.s).toDateString())),n=0,t=new Date();if(!d.has(t.toDateString()))t.setDate(t.getDate()-1);while(d.has(t.toDateString())){n++;t.setDate(t.getDate()-1)}return n}
function acct(){const cd=h=>`<div class="card" style="display:block;cursor:default">${h}</div>`,u=window.fbUser;
 if(!window.fb)return cd('<div class="mu">☁ Accounts need an internet connection. Your library still works offline.</div>');
 if(u===undefined)return cd('<div class="mu">☁ Loading account…</div>');
 const st=esc(v.am||(S.ls?'Last synced '+new Date(S.ls).toLocaleString():'Not synced yet'));
 if(u)return cd(`<b>☁ ${esc(u.email||'Signed in')}</b><div class="mu" id="sst">${st}</div><div class="row"><button class="bt pr" onclick="fb.sync()">Sync now</button><button class="bt" onclick="fb.logout()">Sign out</button></div>`);
 if(!v.ac)return cd(`<div class="row" style="margin:0"><b>☁ Sync across devices</b><span style="flex:1"></span><button class="bt pr" onclick="v.ac=1;R()">Sign in</button></div>${v.am?`<div class="mu">${esc(v.am)}</div>`:''}`);
 return cd(`<b>☁ Sign in or create an account</b><input class="in" id="em" type="email" placeholder="Email" autocomplete="email"><input class="in" id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><div class="row"><button class="bt pr" onclick="fb.login()">Sign in</button><button class="bt" onclick="fb.signup()">Create account</button></div><button class="bt" style="width:100%" onclick="fb.google()">Continue with Google</button><p class="mu" style="margin:8px 0 0"><span onclick="fb.reset()" style="text-decoration:underline;cursor:pointer">Forgot password?</span></p>${v.am?`<p style="color:var(--ac)">${esc(v.am)}</p>`:''}`)}
function H(){const n=s=>S.b.filter(b=>b.st===s).length,y=new Date().getFullYear(),dn=S.b.filter(b=>b.st==='done'&&b.fd&&new Date(b.fd).getFullYear()===y).length,k=stk(),ex=(S.gl||0)*((Date.now()-new Date(y,0,1))/864e5)/365,gt=S.gl?(dn>=S.gl?'Goal reached! 🎉':dn>=ex?'on track':'about '+Math.ceil(ex-dn)+' behind pace'):'',
 rd=S.b.filter(b=>b.st==='reading'),nx=S.b.filter(b=>b.st==='toread').slice(0,10),fin=S.b.filter(b=>b.st==='done').sort((a,b)=>(b.fd||0)-(a.fd||0)).slice(0,10);
 const hero=b=>{const p=pc(b);return `<div class="row" style="margin:14px 6px 6px;justify-content:space-between"><b>${b.sd?'Day '+Math.max(1,Math.ceil((Date.now()-b.sd)/864e5)):'Reading'}</b><span>${(b.m==='pages'||b.adv)&&b.pages?`${b.cur||0} <span class="mu">/ ${b.pages}</span> `:''}(${p.toFixed(0)}%)</span></div><div class="card hero" onclick="op('${b.id}')"><div class="hb"><i style="width:${p}%"></i></div><div class="row" style="flex-wrap:nowrap;gap:16px">${cv(b,'cvh')}<div class="fl"><div class="t" style="white-space:normal;font-size:19px;font-family:Georgia,serif">${esc(b.t)}</div><div class="mu">${esc(b.a)}</div>${b.sd?`<div class="mu" style="margin-top:8px;font-size:13px">Started on ${dt(b.sd)}</div>`:''}${S.t&&S.t.id===b.id?'<div style="color:var(--ac);margin-top:6px">⏱ Session running</div>':''}</div></div></div>`};
 const rail=(l,t,tab)=>l.length?`<div class="row" style="margin-bottom:0"><h2 style="margin:0;flex:1">${t}</h2><span class="tab" onclick="v.tab='${tab}';go('lib')">View all</span></div><div class="rail">${l.map(b=>`<div class="rl" onclick="op('${b.id}')"><div style="position:relative">${cv(b,'cvr')}<i class="rb"></i></div><div class="t" style="margin-top:10px">${esc(b.t)}</div><div class="mu" style="color:var(--ac)">${esc(b.a)}</div></div>`).join('')}</div>`:'';
 return `<div class="row" style="justify-content:space-between;margin-top:0"><h1 style="margin:0">Hi, ${esc(S.nm||'reader')}!</h1><span class="av" onclick="go('more')">📖</span></div>
 <div class="row"><input class="in pillsearch" style="flex:1" placeholder="Search for books" onfocus="go('lib')"><span class="sb" onclick="go('lib')">🔍</span></div>
 ${rd.length?`<h2 style="text-align:center">You’re currently reading ${rd.length} book${rd.length>1?'s':''}!</h2>${rd.slice(0,2).map(hero).join('')}`:'<p class="mu" style="text-align:center">Nothing in progress. Pick something from your up next list!</p>'}
 <div class="tl">${[['toread','To Read'],['done','Finished'],['reading','Reading'],['dnf','Gave Up']].map(([s,l])=>`<div class="tile" onclick="v.tab='${s}';go('lib')"><div><b>${n(s)}</b>${l}</div><span class="ic">${ST[s][1]}</span></div>`).join('')}</div>
 <div class="tile" style="margin-bottom:12px" onclick="v.tab='all';go('lib')"><div style="flex:1;text-align:center"><b>${S.b.length}</b>My Bookshelf</div><span class="ic">📚</span></div>
 <div class="card" style="display:block;cursor:default"><div class="row" style="margin:0"><b>🎯 ${y} reading goal</b><span style="flex:1"></span><input class="in" style="width:90px;flex:none;margin:0" type="number" value="${S.gl||''}" placeholder="books" onchange="S.gl=+this.value||0;S.mm=Date.now();MD=1;save();R()"></div>${S.gl?`<div class="bar"><i style="width:${Math.min(100,dn/S.gl*100)}%"></i></div><div class="mu">${dn} of ${S.gl} books · ${gt}</div>`:''}<div class="mu" style="margin-top:6px">${k?'🔥 '+k+' day reading streak':'Log a session today to start a streak'}</div></div>
 ${rail(nx,'Up next','toread')}${rail(fin,'Recently finished','done')}`}
function LB(){const n=s=>S.b.filter(b=>b.st===s).length,col=(S.col||[]).find(c=>c.id===v.col);
 return `<h1 style="margin-bottom:0">My Library</h1><div class="mu">${S.b.length} books</div>
 <div class="tabs">${[['all','All',S.b.length],['reading','Reading',n('reading')],['toread','Up next',n('toread')],['done','Finished',n('done')],['dnf','Gave up',n('dnf')]].map(([k,l,c])=>`<span class="tab ${v.tab===k?'on':''}" onclick="v.tab='${k}';R()">${l} (${c})</span>`).join('')}</div>

 <div class="row">${[['shelf','▤ Shelf'],['grid','▦ Grid'],['list','☰ List']].map(([k,l])=>`<span class="tab ${(S.vw||'shelf')===k?'on':''}" onclick="S.vw='${k}';save();R()">${l}</span>`).join('')}<span style="flex:1"></span><span class="tab" onclick="v.sh='col';v.cc=0;R()">＋ Collection</span></div>
 ${col?`<div class="row"><b>${esc(col.e||'')} ${esc(col.n)}</b><span style="flex:1"></span><span class="tab" onclick="v.col=null;R()">✕ Clear</span><span class="tab" onclick="delc('${col.id}')">Delete</span></div>`:((S.col||[]).length?`<h2>Collections</h2><div class="rail">${S.col.map(colcard).join('')}</div>`:'')}
 <div id="ls">${lst()}</div>`}
